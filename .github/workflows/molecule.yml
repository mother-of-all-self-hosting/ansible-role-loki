---
name: molecule

on:  # yamllint disable-line rule:truthy
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "LICENSES/**"
      - "REUSE.toml"
  workflow_dispatch:

jobs:
  molecule:
    name: Run Molecule scenario '${{ matrix.scenario }}' on ${{ matrix.distro }}
    runs-on: ubuntu-latest

    # Same-repository pull requests already run via the push event;
    # run pull_request jobs only for pull requests from forks.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository

    strategy:
      matrix:
        distro:
          - ubuntu2604
          - debian13
        scenario:
          - default
      fail-fast: false

    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
      PY_COLORS: "1"
      ANSIBLE_FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: loki

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: loki/.python-version
          cache: pip
          cache-dependency-path: loki/molecule/requirements.txt

      - name: Install Python dependencies
        working-directory: loki
        run: pip install -r molecule/requirements.txt

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('loki/molecule/default/requirements.yml') }}

      - name: Run Molecule
        working-directory: loki
        run: molecule test --scenario-name ${{ matrix.scenario }}
